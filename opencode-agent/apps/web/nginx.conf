# 前端容器 nginx 配置
# - 托管 Vite 构建的静态文件
# - /api 反向代理到同 namespace 的管理后端 Service（opencode-server:3000）
#
# 注意：直接 proxy_pass（不用变量），nginx 会用 /etc/resolv.conf 解析，
# 能利用 K8s 的 search domain（svc.cluster.local 等），短名即可解析。
# 用 initContainer 保证后端就绪后再启动 nginx，避免启动时 DNS 解析失败。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback：所有非文件请求回退到 index.html（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到管理后端（同 namespace，K8s DNS 可解析短名）
    location /api/ {
        proxy_pass http://opencode-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（对话流式响应）：禁用缓冲，超时放宽
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存（带 hash 的文件名可永久缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
