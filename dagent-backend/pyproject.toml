[project]
name = "dagent"
version = "0.1.0"
description = "Dagent - AI-powered development agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42.0",
    "passlib[bcrypt]>=1.7",
    "alembic>=1.13",
    "httpx>=0.27",
    "jinja2>=3.1",
    "json-repair==0.*",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
