apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dagent
resources:
  - namespace.yaml
  - configmap.yaml
  - mysql-rds.yaml
  - backend.yaml
  - frontend.yaml
  - frontend-tunnel.yaml
  - agent/requirement-agent.yaml
  - agent/development-agent.yaml
configMapGenerator:
  - name: dagent-frontend-nginx
    files:
      - default.conf=frontend/default.conf
  - name: dagent-workspace-manager
    files:
      - workspace-manager.mjs=agent/workspace-manager.mjs
      - git-askpass.sh=agent/git-askpass.sh
  - name: dagent-agent-skills
    files:
      - grill-me-SKILL.md=agent/skills/grill-me/SKILL.md
      - dev-plan-SKILL.md=agent/skills/dev-plan/SKILL.md
  - name: dagent-serena-config
    files:
      - serena_config.yml=agent/serena_config.yml
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: dagent-backend
    newName: docker.m.daocloud.io/library/python
    newTag: 3.11-slim-bookworm
