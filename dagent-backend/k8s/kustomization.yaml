apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dagent
resources:
  - namespace.yaml
  - configmap.yaml
  - mysql-rds.yaml
  - requirement-runtime-rbac.yaml
  - requirement-runtime-network-policy.yaml
  - repository-verifier.yaml
  - backend.yaml
  - frontend.yaml
  - frontend-tunnel.yaml
configMapGenerator:
  - name: dagent-frontend-nginx
    files:
      - default.conf=frontend/default.conf
  - name: dagent-workspace-manager
    files:
      - workspace-manager.mjs=agent/workspace-manager.mjs
      - git-askpass.sh=agent/git-askpass.sh
      - derive-runtime-auth.mjs=agent/derive-runtime-auth.mjs
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: dagent-backend
    newName: docker.m.daocloud.io/library/python
    newTag: 3.11-slim-bookworm
