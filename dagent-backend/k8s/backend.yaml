apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagent-backend
  labels:
    app.kubernetes.io/name: dagent-backend
    app.kubernetes.io/part-of: dagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dagent-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dagent-backend
        app.kubernetes.io/part-of: dagent
    spec:
      serviceAccountName: dagent-backend
      imagePullSecrets:
        - name: opencode-pull-secret
      nodeSelector:
        kubernetes.io/hostname: cn-hangzhou.10.45.144.67
      containers:
        - name: backend
          image: dagent-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: dagent-config
            - secretRef:
                name: dagent-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dagent-rds
                  key: DATABASE_URL
            - name: GLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dagent-glm
                  key: GLM_API_KEY
            - name: PERSONAL_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dagent-personal-openai
                  key: OPENAI_API_KEY
            - name: OPENCODE_SERVER_USERNAME
              value: opencode
            - name: AGENT_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dagent-agent-callback
                  key: AGENT_CALLBACK_TOKEN
            - name: GIT_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: dagent-git-credential-key
                  key: GIT_CREDENTIAL_ENCRYPTION_KEY
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dagent-backend
  labels:
    app.kubernetes.io/name: dagent-backend
    app.kubernetes.io/part-of: dagent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dagent-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
