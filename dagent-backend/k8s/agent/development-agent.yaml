apiVersion: v1
kind: ConfigMap
metadata:
  name: dagent-development-agent-config
  namespace: dagent
  labels:
    app.kubernetes.io/name: dagent-development-agent
    app.kubernetes.io/part-of: dagent
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "bigmodel/glm-4.7-flash",
      "small_model": "bigmodel/glm-4.7-flash",
      "provider": {
        "bigmodel": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "BigModel Coding",
          "options": {
            "baseURL": "http://dagent-backend:8000/api/v1/model-proxy/v1",
            "timeout": 300000,
            "apiKey": "{env:AGENT_CALLBACK_TOKEN}"
          },
          "models": {
            "glm-4.7-flash": {
              "name": "GLM-4.7 Flash"
            }
          }
        }
      },
      "agent": {
        "development": {
          "description": "Dagent development agent for scoped repository changes",
          "mode": "primary",
          "model": "bigmodel/glm-4.7-flash",
          "steps": 24,
          "prompt": "You are the Dagent development agent. The backend supplies a task mode for development documents, implementation, or failure fixes. Never create or call child agents. Work only inside the current requirement workspace and obey the request-level tool restrictions enforced by the backend. Preserve existing conventions, never invent command results, and never push, merge, expose secrets, or access another requirement workspace.",
          "permission": {
            "read": "allow",
            "edit": "allow",
            "grep": "allow",
            "glob": "allow",
            "list": "allow",
            "skill": "allow",
            "question": "deny",
            "external_directory": "deny",
            "task": "deny",
            "webfetch": "deny",
            "websearch": "deny",
            "bash": {
              "*": "allow",
              "git reset*": "deny",
              "git push*": "deny",
              "git merge*": "deny",
              "rm -rf *": "deny"
            }
          }
        }
      },
      "permission": {
        "read": "allow",
        "edit": "ask",
        "grep": "allow",
        "glob": "allow",
        "list": "allow",
        "skill": "allow",
        "question": "deny",
        "external_directory": "deny",
        "task": "deny",
        "webfetch": "deny",
        "websearch": "deny",
        "bash": {
          "*": "allow",
          "git reset*": "deny",
          "git push*": "deny",
          "git merge*": "deny",
          "rm -rf *": "deny"
        }
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dagent-development-agent-data
  namespace: dagent
  labels:
    app.kubernetes.io/name: dagent-development-agent
    app.kubernetes.io/part-of: dagent
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: alicloud-disk-topology-alltype
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagent-development-agent
  namespace: dagent
  labels:
    app.kubernetes.io/name: dagent-development-agent
    app.kubernetes.io/part-of: dagent
    dagent/agent-role: development
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dagent-development-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dagent-development-agent
        app.kubernetes.io/part-of: dagent
        dagent/agent-role: development
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: opencode-pull-secret
      securityContext:
        runAsUser: 1500
        runAsGroup: 1500
        fsGroup: 1500
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: initialize-workspace
          image: registry.cn-hangzhou.aliyuncs.com/citics_lwj/opencode:1.15.12
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /data/skills /data/state /data/requirement-state /data/workspaces && chown -R 1500:1500 /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: opencode
          image: registry.cn-hangzhou.aliyuncs.com/citics_lwj/opencode-test-runtime:1.15.12-v2
          imagePullPolicy: IfNotPresent
          command:
            - opencode
            - serve
            - --hostname
            - 0.0.0.0
            - --port
            - "4096"
          envFrom:
            - secretRef:
                name: dagent-development-agent-auth
            - secretRef:
                name: dagent-agent-callback
          env:
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
              value: /usr/bin/chromium-browser
            - name: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
              value: "1"
          ports:
            - name: opencode
              containerPort: 4096
          startupProbe:
            tcpSocket:
              port: opencode
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: opencode
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: opencode
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /home/opencode/.config/opencode/opencode.json
              subPath: opencode.json
              readOnly: true
            - name: data
              mountPath: /home/opencode/.config/opencode/skills
              subPath: skills
            - name: data
              mountPath: /home/opencode/.local/share/opencode
              subPath: state
            - name: data
              mountPath: /workspaces
              subPath: workspaces
        - name: monitor-sidecar
          image: registry.cn-hangzhou.aliyuncs.com/citics_lwj/opencode-sidecar:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: dagent-development-agent-auth
            - secretRef:
                name: dagent-agent-callback
          env:
            - name: OPENCODE_DIR
              value: /home/opencode/.local/share/opencode
            - name: SKILLS_DIR
              value: /home/opencode/.config/opencode/skills
            - name: OPENCODE_BASE
              value: http://localhost:4096
            - name: AUDIT_LOG_PATH
              value: /home/opencode/.local/share/opencode/audit.log
            - name: AGENT_NAME
              value: dagent-development-agent
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: sidecar
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: sidecar
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: sidecar
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: sidecar
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /home/opencode/.config/opencode/skills
              subPath: skills
            - name: data
              mountPath: /home/opencode/.local/share/opencode
              subPath: state
            - name: data
              mountPath: /workspaces
              subPath: workspaces
        - name: workspace-manager
          image: registry.cn-hangzhou.aliyuncs.com/citics_lwj/opencode:1.15.12
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /opt/dagent/workspace-manager.mjs
          envFrom:
            - secretRef:
                name: dagent-development-agent-auth
            - secretRef:
                name: dagent-agent-callback
          env:
            - name: WORKSPACE_ROOT
              value: /workspaces
            - name: WORKSPACE_MANAGER_PORT
              value: "8090"
          ports:
            - name: workspace
              containerPort: 8090
          startupProbe:
            httpGet:
              path: /health
              port: workspace
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: workspace
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: workspace
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace-manager
              mountPath: /opt/dagent
              readOnly: true
            - name: data
              mountPath: /workspaces
              subPath: workspaces
      volumes:
        - name: config
          configMap:
            name: dagent-development-agent-config
        - name: data
          persistentVolumeClaim:
            claimName: dagent-development-agent-data
        - name: workspace-manager
          configMap:
            name: dagent-workspace-manager
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: dagent-development-agent
  namespace: dagent
  labels:
    app.kubernetes.io/name: dagent-development-agent
    app.kubernetes.io/part-of: dagent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dagent-development-agent
  ports:
    - name: opencode
      port: 4096
      targetPort: opencode
    - name: sidecar
      port: 8080
      targetPort: sidecar
    - name: workspace
      port: 8090
      targetPort: workspace
