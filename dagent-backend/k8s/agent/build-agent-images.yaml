apiVersion: batch/v1
kind: Job
metadata:
  name: dagent-requirement-clarification-image-v2
  namespace: dagent
  labels:
    app.kubernetes.io/part-of: dagent
    app.kubernetes.io/component: agent-image-build
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: opencode-pull-secret
      initContainers:
        - name: stage-context
          image: registry.cn-hangzhou.aliyuncs.com/citics_lwj/opencode:1.15.12
          command: ["sh", "-c"]
          args:
            - cp -L /config/* /workspace/ && test -f /workspace/Dockerfile && test -f /workspace/opencode.json
          volumeMounts:
            - { name: source, mountPath: /config, readOnly: true }
            - { name: context, mountPath: /workspace }
      containers:
        - name: kaniko
          image: gcr.m.daocloud.io/kaniko-project/executor:v1.23.2-debug
          args:
            - --context=dir:///workspace
            - --dockerfile=/workspace/Dockerfile
            - --destination=registry.cn-hangzhou.aliyuncs.com/citics_lwj/dagent-requirement-clarification:1.0.1
            - --cache=true
            - --snapshot-mode=redo
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: context, mountPath: /workspace, readOnly: true }
            - { name: registry-auth, mountPath: /kaniko/.docker/config.json, subPath: .dockerconfigjson, readOnly: true }
      volumes:
        - name: context
          emptyDir: {}
        - name: source
          configMap: { name: dagent-requirement-clarification-image-v2 }
        - name: registry-auth
          secret: { secretName: opencode-pull-secret }
---
