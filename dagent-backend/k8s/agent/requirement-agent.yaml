apiVersion: v1
kind: ConfigMap
metadata:
  name: dagent-requirement-agent-config
  namespace: dagent
  labels:
    app.kubernetes.io/name: dagent-requirement-agent
    app.kubernetes.io/part-of: dagent
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "model": "bigmodel/glm-4.7-flash",
      "small_model": "bigmodel/glm-4.7-flash",
      "provider": {
        "bigmodel": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "BigModel Coding",
          "options": {
            "baseURL": "http://dagent-backend:8000/api/v1/model-proxy/v1",
            "timeout": 300000,
            "apiKey": "{env:AGENT_CALLBACK_TOKEN}"
          },
          "models": {
            "glm-4.7-flash": {
              "name": "GLM-4.7 Flash"
            }
          }
        }
      },
      "agent": {
        "requirement_clarification": {
          "description": "Dagent requirement clarification agent",
          "mode": "primary",
          "model": "bigmodel/glm-4.7-flash",
          "steps": 12,
          "prompt": "You are the Dagent requirement clarification agent. Use the grill-me method: inspect the scoped repository first, resolve facts from code, ask one focused unresolved decision per question, avoid repeating answered clarification rounds, and include a recommendation grounded in a file or code pattern for every question. Analyze requirements and bound repositories read-only. Ask only decisions that materially affect scope, behavior, data, integration, security, or acceptance. Never edit files, call child agents, push, merge, or expose secrets. Return the JSON shape requested by the caller.",
          "permission": {
            "read": "allow",
            "edit": "deny",
            "grep": "allow",
            "glob": "allow",
            "list": "allow",
            "skill": "allow",
            "question": "deny",
            "external_directory": "deny",
            "task": "deny",
            "webfetch": "deny",
            "websearch": "deny",
            "bash": {
              "*": "deny",
              "ls*": "allow",
              "find*": "allow",
              "git status*": "allow",
              "git diff*": "allow",
              "git log*": "allow",
              "git show*": "allow",
              "git branch*": "allow"
            }
          }
        }
      },
      "permission": {
        "read": "allow",
        "edit": "deny",
        "grep": "allow",
        "glob": "allow",
        "list": "allow",
        "skill": "allow",
        "question": "deny",
        "external_directory": "deny",
        "task": "deny",
        "webfetch": "deny",
        "websearch": "deny",
        "bash": "deny"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagent-requirement-agent
  namespace: dagent
  labels:
    app.kubernetes.io/name: dagent-requirement-agent
    app.kubernetes.io/part-of: dagent
    dagent/agent-role: requirement-clarification
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dagent-requirement-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dagent-requirement-agent
        app.kubernetes.io/part-of: dagent
        dagent/agent-role: requirement-clarification
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: opencode-pull-secret
      securityContext:
        runAsUser: 1500
        runAsGroup: 1500
        fsGroup: 1500
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: initialize-state
          image: registry.cn-hangzhou.aliyuncs.com/citics_lwj/opencode:1.15.12
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /data/requirement-state /data/workspaces && chown -R 1500:1500 /data/requirement-state
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: opencode
          image: registry.cn-hangzhou.aliyuncs.com/citics_lwj/opencode-test-runtime:1.15.12-v2
          imagePullPolicy: IfNotPresent
          command:
            - opencode
            - serve
            - --hostname
            - 0.0.0.0
            - --port
            - "4096"
          envFrom:
            - secretRef:
                name: dagent-development-agent-auth
            - secretRef:
                name: dagent-agent-callback
          ports:
            - name: opencode
              containerPort: 4096
          startupProbe:
            tcpSocket:
              port: opencode
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: opencode
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: opencode
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /home/opencode/.config/opencode/opencode.json
              subPath: opencode.json
              readOnly: true
            - name: data
              mountPath: /home/opencode/.local/share/opencode
              subPath: requirement-state
            - name: data
              mountPath: /workspaces
              subPath: workspaces
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dagent-requirement-agent-config
        - name: data
          persistentVolumeClaim:
            claimName: dagent-development-agent-data
---
apiVersion: v1
kind: Service
metadata:
  name: dagent-requirement-agent
  namespace: dagent
  labels:
    app.kubernetes.io/name: dagent-requirement-agent
    app.kubernetes.io/part-of: dagent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dagent-requirement-agent
  ports:
    - name: opencode
      port: 4096
      targetPort: opencode
