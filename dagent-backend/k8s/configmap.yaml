apiVersion: v1
kind: ConfigMap
metadata:
  name: dagent-config
data:
  APP_NAME: dagent
  DEBUG: "false"
  AUTO_CREATE_SCHEMA: "true"
  SEED_DEMO_DATA: "true"
  QUICK_LOGIN_ENABLED: "true"
  CORS_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173,https://bold-spine-leon-bids.trycloudflare.com"
  AGENT_RUNTIME_ENABLED: "true"
  REQUIREMENT_OPENCODE_SERVER_URL: "http://dagent-requirement-agent:4096"
  DEVELOPMENT_OPENCODE_SERVER_URL: "http://dagent-development-agent:4096"
  WORKSPACE_MANAGER_URL: "http://dagent-development-agent:8090"
  AGENT_INTERNAL_API_URL: "http://127.0.0.1:8000/api/v1"
  AGENT_WORKSPACE_ROOT: "/workspaces"
