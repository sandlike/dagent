apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagent-frontend
  labels:
    app.kubernetes.io/name: dagent-frontend
    app.kubernetes.io/part-of: dagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dagent-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dagent-frontend
        app.kubernetes.io/part-of: dagent
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: install-frontend
          image: docker.m.daocloud.io/library/nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - tar -xzf /bundle/frontend.tar.gz -C /work
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: frontend-bundle
              mountPath: /bundle
              readOnly: true
            - name: web-root
              mountPath: /work
      containers:
        - name: nginx
          image: docker.m.daocloud.io/library/nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: web-root
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: frontend-bundle
          configMap:
            name: dagent-frontend-bundle-v15
        - name: nginx-config
          configMap:
            name: dagent-frontend-nginx
        - name: web-root
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dagent-frontend
  labels:
    app.kubernetes.io/name: dagent-frontend
    app.kubernetes.io/part-of: dagent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dagent-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
