apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagent-frontend-tunnel
  labels:
    app.kubernetes.io/name: dagent-frontend-tunnel
    app.kubernetes.io/part-of: dagent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dagent-frontend-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dagent-frontend-tunnel
        app.kubernetes.io/part-of: dagent
    spec:
      containers:
        - name: cloudflared
          image: docker.m.daocloud.io/cloudflare/cloudflared:latest
          imagePullPolicy: Always
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --url
            - http://dagent-frontend:80
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
